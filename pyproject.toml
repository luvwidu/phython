[project]
name = "phython"
version = "0.1.0"
description = "Friday — central orchestrator agent that coordinates work across projects"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.80",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
friday = "friday.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday"]
